name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '${{ matrix.go }}'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l *.go)"
